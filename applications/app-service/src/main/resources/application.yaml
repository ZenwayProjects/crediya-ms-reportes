server:
  port: 8082
spring:
  application:
    name: "reportes"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
entrypoint:
  sqs:
    region: "${SQS_REGION}"
    queueUrl: "${SQS_COLA_SOLICITUD_APROBADA}"
    waitTimeSeconds: 5
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080,http://localhost:8081,http://localhost:8082"
aws:
  region: "${AWS_REGION}"
  dynamodb:
    tables:
      reportes: "${DYNAMODB_TABLE_REPORTES}"
